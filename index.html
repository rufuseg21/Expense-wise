<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Wise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <i class="fas fa-wallet"></i>
        <h1>Expense Wise</h1>
      </div>
      <p class="tagline">Track your money, own your life</p>
    </header>

    <main>
      <section class="add-expense">
        <h2><i class="fas fa-plus-circle"></i> Add New Expense</h2>
        <form id="expense-form">
          <div class="form-group">
            <label for="expense-name">What did you spend on?</label>
            <input type="text" id="expense-name" placeholder="e.g. Chicken and chips" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="expense-amount">Amount (₦)</label>
              <input type="number" id="expense-amount" placeholder="0.00" min="0" step="any" required>
            </div>

            <div class="form-group">
              <label for="expense-category">Category</label>
              <select id="expense-category">
                <option value="Food & Drinks">Food & Drinks</option>
                <option value="Data & Subscriptions">Data & Subscriptions</option>
                <option value="Transport">Transport</option>
                <option value="Side Hustle">Side Hustle</option>
                <option value="Black Tax">Black Tax</option>
                <option value="Health">Health</option>
                <option value="Entertainment">Entertainment</option>
              </select>
            </div>
          </div>

          <button type="submit" id="add-btn">
            <i class="fas fa-plus"></i> Add Expense
          </button>
        </form>
      </section>

      <section class="expense-list">
        <div class="list-header">
          <h2><i class="fas fa-list"></i> Your Expenses</h2>
          <div class="total-display">
            <span>Total:</span>
            <span id="total-amount">₦0.00</span>
          </div>
        </div>

        <div id="expenses-container">
          <div class="empty-state" id="empty-state">
            <i class="fas fa-receipt"></i>
            <p>No expenses yet.<br>Add one above!</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
